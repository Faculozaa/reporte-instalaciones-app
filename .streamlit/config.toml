[theme]
# Archivo (Omnibus-Type, Buenos Aires), con el eje de ancho para titulares y cifras.
font = "Archivo:https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap"
baseRadius = "0.3rem"
headingFontSizes = ["2rem", "1.2rem", "1.05rem"]
headingFontWeights = [700, 650, 650]
showSidebarBorder = true

[theme.light]
primaryColor = "#007A85"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EEF3F4"
textColor = "#102A33"
borderColor = "#D5DFE2"
dataframeBorderColor = "#D5DFE2"
dataframeHeaderBackgroundColor = "#EEF3F4"

[theme.dark]
primaryColor = "#00A9B7"
backgroundColor = "#0E1D22"
secondaryBackgroundColor = "#15282E"
textColor = "#E3ECEE"
borderColor = "#24393F"
dataframeBorderColor = "#24393F"
dataframeHeaderBackgroundColor = "#15282E"
